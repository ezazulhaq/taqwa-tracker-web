<div class="flex flex-col items-center justify-start md:justify-center h-100 bg-gray-200 dark:bg-slate-800">

  <!-- Update Notification -->
  @if (autoUpdateService.updateAvailable()) {
  <app-update-notification (updateNow)="autoUpdateService.activateUpdate()"
    (dismiss)="autoUpdateService.dismissUpdate()">
  </app-update-notification>
  }

  <!-- Header -->
  <app-header></app-header>

  <router-outlet></router-outlet>

  <!-- Menu added for mobile -->
  @if (headerService.isMenuVisible()){
  <app-menu></app-menu>
  }

  <!-- Settings -->
  @if (headerService.isSettingsVisible()){
  <app-settings></app-settings>
  }

  <app-scroll-top></app-scroll-top>
</div>
