<a [routerLink]="link()"
    class="flex flex-col items-center justify-center p-3 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700 hover:shadow-md hover:border-emerald-200 dark:hover:border-emerald-700 transition-all duration-300 group aspect-square">

    <div
        [class]="'w-12 h-12 mb-3 rounded-full flex items-center justify-center transition-colors ' + (color() || 'bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400 group-hover:bg-emerald-100 dark:group-hover:bg-emerald-900/50')">
        <svg [attr.viewBox]="viewBox()" class="w-6 h-6 fill-current">
            <path [attr.d]="path()" />
        </svg>
    </div>

    <span
        class="text-sm font-medium text-slate-700 dark:text-slate-300 group-hover:text-emerald-700 dark:group-hover:text-emerald-400 text-center leading-tight">
        {{ title() }}
    </span>

</a>
