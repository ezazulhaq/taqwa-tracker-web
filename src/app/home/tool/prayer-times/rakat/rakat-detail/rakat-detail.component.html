<div class="flex items-center justify-between group">
    <!-- Label with icon -->
    <span
        class="text-sm font-medium text-slate-700 dark:text-slate-200 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">
        {{ label() }}
    </span>

    <!-- Value with badge style -->
    <span
        class="inline-flex items-center px-3 py-1 rounded-full text-sm font-bold bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
        {{ value() }}
        <span class="ml-1 text-xs font-normal opacity-75">rak'ah{{ value() !== 1 && value() !== '1' ? 's' : ''
            }}</span>
    </span>
</div>
