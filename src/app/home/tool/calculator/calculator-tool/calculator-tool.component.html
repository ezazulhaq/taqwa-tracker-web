<div class="fixed bottom-6 right-6 z-50">
    <!-- Floating Action Button -->
    <button (click)="toggle()"
        class="w-14 h-14 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white shadow-lg flex items-center justify-center transition-all duration-300 transform"
        [class.rotate-45]="isOpen()" title="Open Calculator">
        @if (isOpen()) {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
        } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
        }
    </button>

    <!-- Calculator UI -->
    @if (isOpen()) {
    <div
        class="absolute bottom-20 right-0 w-72 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl overflow-hidden border border-gray-100 dark:border-gray-700 transition-all duration-300 animate-in fade-in slide-in-from-bottom-4">
        <!-- Display -->
        <div class="p-6 bg-gray-50 dark:bg-gray-900/50 text-right">
            <div class="text-xs text-gray-500 dark:text-gray-400 h-4 mb-1">
                {{ firstOperand() }} {{ operator() }}
            </div>
            <div class="text-3xl font-bold text-gray-800 dark:text-white truncate">
                {{ display() }}
            </div>
        </div>

        <!-- Buttons Grid -->
        <div class="p-4 grid grid-cols-4 gap-2">
            <button (click)="clear()"
                class="p-3 text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/20 rounded-xl font-bold transition-colors">AC</button>
            <button (click)="setOperator('/')"
                class="p-3 text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 rounded-xl font-bold transition-colors">÷</button>
            <button (click)="setOperator('*')"
                class="p-3 text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 rounded-xl font-bold transition-colors">×</button>
            <button (click)="setOperator('-')"
                class="p-3 text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 rounded-xl font-bold transition-colors">−</button>

            <button (click)="appendDigit('7')"
                class="p-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">7</button>
            <button (click)="appendDigit('8')"
                class="p-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">8</button>
            <button (click)="appendDigit('9')"
                class="p-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">9</button>
            <button (click)="setOperator('+')"
                class="p-3 text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 rounded-xl font-bold transition-colors">+</button>

            <button (click)="appendDigit('4')"
                class="p-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">4</button>
            <button (click)="appendDigit('5')"
                class="p-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">5</button>
            <button (click)="appendDigit('6')"
                class="p-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">6</button>
            <button (click)="calculate()"
                class="row-span-2 p-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-md transition-all">=</button>

            <button (click)="appendDigit('1')"
                class="p-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">1</button>
            <button (click)="appendDigit('2')"
                class="p-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">2</button>
            <button (click)="appendDigit('3')"
                class="p-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">3</button>

            <button (click)="appendDigit('0')"
                class="col-span-2 p-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">0</button>
            <button (click)="appendDecimal()"
                class="p-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl font-medium transition-colors">.</button>
        </div>
    </div>
    }
</div>
