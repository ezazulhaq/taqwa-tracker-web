<app-title [title]="'The Taqwa Tracker'" [subTitle]="'All-in-One Islamic Companion'"></app-title>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 px-4 md:px-8 mb-8 w-full max-w-6xl mx-auto">
    <!-- Prayer times can span 2 columns on tablet/desktop, 1 on mobile -->
    <div class="col-span-1 md:col-span-2 lg:col-span-2 flex flex-col h-full">
        <app-prayer-times-widget class="flex-1" />
    </div>

    <!-- Recommended apps spans 1 column -->
    <div class="col-span-1 flex flex-col h-full">
        <app-recommended-apps-widget class="flex-1" />
    </div>

    <!-- Streak dashboard spans full width on mobile, 3 columns on large desktop -->
    <div class="col-span-1 md:col-span-2 lg:col-span-3 flex flex-col">
        <app-streak-dashboard />
    </div>
</div>

<!-- Footer/Fixed Elements -->
<app-install-pwa />

<!-- Welcome Popup -->
<app-welcome />
