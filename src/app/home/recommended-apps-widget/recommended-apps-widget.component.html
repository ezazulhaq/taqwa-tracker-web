<div class="mb-6 h-full flex flex-col justify-center">
    <div class="grid grid-cols-4 gap-3 p-4 glass-panel h-full content-center">
        @for (app of recommendedApps; track app.title) {
        <app-icon [title]="app.title" [link]="app.link" [path]="app.path" [viewBox]="app.viewBox"
            class="aspect-[4/3]" />
        }
    </div>
</div>
