<div class="relative w-full bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-stone-200 dark:border-slate-600 p-8"
    [id]="'ayah-' + ayah().ayah_no">
    @if(isAuthenticated()){
    <!-- Action buttons container -->
    <div class="absolute top-4 right-4 flex items-center space-x-2">
        <!-- Read Button -->
        <button (click)="onReadClick.emit(ayah())"
            class="p-2 bg-stone-100 dark:bg-slate-700 hover:bg-stone-200 dark:hover:bg-slate-600 rounded-lg transition-colors group"
            title="Read Ayah">
            <svg class="size-4 text-stone-600 dark:text-stone-300 group-hover:text-stone-800 dark:group-hover:text-stone-100"
                fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                <path
                    d="M96 0C43 0 0 43 0 96L0 416c0 53 43 96 96 96l288 0c43 0 96-43 96-96l0-320c0-53-43-96-96-96L96 0zM416 96l0 320c0 17.7-14.3 32-32 32l-288 0c-17.7 0-32-14.3-32-32l0-320c0-17.7 14.3-32 32-32l288 0c17.7 0 32 14.3 32 32zM288 160l-128 0c-8.8 0-16 7.2-16 16s7.2 16 16 16l128 0c8.8 0 16-7.2 16-16s-7.2-16-16-16zM288 256l-128 0c-8.8 0-16 7.2-16 16s7.2 16 16 16l128 0c8.8 0 16-7.2 16-16s-7.2-16-16-16zM288 352l-128 0c-8.8 0-16 7.2-16 16s7.2 16 16 16l128 0c8.8 0 16-7.2 16-16s-7.2-16-16-16z" />
            </svg>
        </button>

        <!-- Copy Button -->
        <button (click)="copyAyah(ayah())"
            class="p-2 bg-stone-100 dark:bg-slate-700 hover:bg-stone-200 dark:hover:bg-slate-600 rounded-lg transition-colors group"
            title="Copy Ayah">
            <svg class="size-4 text-stone-600 dark:text-stone-300 group-hover:text-stone-800 dark:group-hover:text-stone-100"
                fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                <path
                    d="M384 336H192c-8.8 0-16-7.2-16-16V64c0-8.8 7.2-16 16-16l140.1 0L400 115.9V320c0 8.8-7.2 16-16 16zM192 384H384c35.3 0 64-28.7 64-64V115.9c0-12.7-5.1-24.9-14.1-33.9L366.1 14.1c-9-9-21.2-14.1-33.9-14.1H192c-35.3 0-64 28.7-64 64V320c0 35.3 28.7 64 64 64zM64 128c-35.3 0-64 28.7-64 64V448c0 35.3 28.7 64 64 64H256c35.3 0 64-28.7 64-64V416H272v32c0 8.8-7.2 16-16 16H64c-8.8 0-16-16V192c0-8.8 7.2-16 16-16H96V128H64z" />
            </svg>
        </button>

        <!-- Bookmark Button -->
        <button (click)="toggleBookmark({surah_id: ayah().surah_no, ayah_id: ayah().ayah_no})"
            class="p-2 rounded-lg transition-colors group"
            [class.bg-emerald-100]="isBookmarked({surah_id: ayah().surah_no, ayah_id: ayah().ayah_no})"
            [class.dark:bg-emerald-900/30]="isBookmarked({surah_id: ayah().surah_no, ayah_id: ayah().ayah_no})"
            [class.hover:bg-emerald-200]="isBookmarked({surah_id: ayah().surah_no, ayah_id: ayah().ayah_no})"
            [class.dark:hover:bg-emerald-900/50]="isBookmarked({surah_id: ayah().surah_no, ayah_id: ayah().ayah_no})"
            [class.bg-stone-100]="!isBookmarked({surah_id: ayah().surah_no, ayah_id: ayah().ayah_no})"
            [class.dark:bg-slate-700]="!isBookmarked({surah_id: ayah().surah_no, ayah_id: ayah().ayah_no})"
            [class.hover:bg-stone-200]="!isBookmarked({surah_id: ayah().surah_no, ayah_id: ayah().ayah_no})"
            [class.dark:hover:bg-slate-600]="!isBookmarked({surah_id: ayah().surah_no, ayah_id: ayah().ayah_no})"
            title="Bookmark Ayah">
            @if(isBookmarked({surah_id: ayah().surah_no, ayah_id: ayah().ayah_no})){
            <svg class="size-4 text-emerald-600 dark:text-emerald-400" fill="currentColor"
                xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
                <path
                    d="M0 48V487.7C0 501.1 10.9 512 24.3 512c5 0 9.9-1.5 14-4.4L192 400 345.7 507.6c4.1 2.9 9 4.4 14 4.4c13.4 0 24.3-10.9 24.3-24.3V48c0-26.5-21.5-48-48-48H48C21.5 0 0 21.5 0 48z" />
            </svg>
            }
            @else{
            <svg class="size-4 text-stone-600 dark:text-stone-300 group-hover:text-stone-800 dark:group-hover:text-stone-100"
                fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
                <path
                    d="M0 48C0 21.5 21.5 0 48 0l0 48 0 393.4 130.1-92.9c8.3-6 19.6-6 27.9 0L336 441.4 336 48 48 48 48 0 336 0c26.5 0 48 21.5 48 48l0 440c0 9-5 17.2-13 21.3s-17.6 3.4-24.9-1.8L192 397.5 37.9 507.5c-7.3 5.2-16.9 5.9-24.9 1.8S0 497 0 488L0 48z" />
            </svg>
            }
        </button>
    </div>
    }

    <!-- Ayah Number -->
    <div class="mb-6">
        <div
            class="inline-flex items-center justify-center w-10 h-10 bg-gradient-to-br from-emerald-100 to-teal-100 dark:from-emerald-900/30 dark:to-teal-900/30 rounded-full border-2 border-emerald-200 dark:border-emerald-800">
            <span class="text-emerald-700 dark:text-emerald-300 font-bold text-sm">{{ayah().ayah_no}}</span>
        </div>
    </div>

    <!-- Arabic Text -->
    <div [style.fontSize.px]="quranService.ayahFontSize()"
        class="text-right font-indopak leading-[60px] md:leading-[70px] text-stone-800 dark:text-stone-200 mb-6">
        {{ayah().arabic_text}} ۝
    </div>

    <!-- Translation -->
    <div class="border-t border-stone-200 dark:border-slate-600 pt-6">
        <div class="flex items-start text-start space-x-3">
            <div class="p-1 bg-emerald-100 dark:bg-emerald-900/30 rounded-full mt-1">
                <svg class="size-3 text-emerald-600 dark:text-emerald-400" fill="currentColor" viewBox="0 0 20 20">
                    <path
                        d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z" />
                </svg>
            </div>
            <p class="font-app-serif text-lg text-stone-700 dark:text-stone-300 leading-relaxed italic">
                {{ayah().translation_text}}</p>
        </div>
    </div>
</div>
