<app-title [title]="'Qur\'ān'" [routerLink]="'/home'"></app-title>

<!-- Floating Search Button -->
<button (click)="openSearch()"
    class="fixed top-6 right-6 z-40 p-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full shadow-lg shadow-emerald-500/30 hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
    </svg>
</button>

<!-- Tabs -->
<div class="flex justify-center mb-6 px-4">
    <div class="bg-stone-100 dark:bg-slate-700/50 p-1.5 rounded-2xl flex shadow-inner">
        <a routerLink="surah"
            routerLinkActive="bg-white dark:bg-slate-600 shadow-sm text-emerald-700 dark:text-emerald-400 font-semibold"
            class="px-6 py-2.5 rounded-xl text-sm text-stone-500 dark:text-stone-400 hover:text-stone-700 dark:hover:text-stone-300 transition-all duration-200 focus:outline-none cursor-pointer">
            Surah
        </a>
        <a routerLink="juz"
            routerLinkActive="bg-white dark:bg-slate-600 shadow-sm text-emerald-700 dark:text-emerald-400 font-semibold"
            class="px-6 py-2.5 rounded-xl text-sm text-stone-500 dark:text-stone-400 hover:text-stone-700 dark:hover:text-stone-300 transition-all duration-200 focus:outline-none cursor-pointer">
            Juz / Para
        </a>
    </div>
</div>

<router-outlet></router-outlet>

@if(isSearchOpen()) {
<app-search (closeSearchEvent)="closeSearch()"></app-search>
}
