<app-title [title]="surahName()" [subTitle]="surahName_ar()" [routerLink]="'/quran/surah'"></app-title>

<div #stickyCheckbox class="w-full mb-6 px-4">
    <div class="bg-white dark:bg-slate-800 rounded-lg shadow-md border border-stone-200 dark:border-slate-600 p-3">
        <div class="flex justify-between items-center space-x-4">
            <!-- Translation Toggle -->
            <div class="flex items-center">

                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" [(ngModel)]="isTranslationVisible" class="sr-only" />
                    <div class="relative">
                        <div class="w-10 h-6 bg-stone-300 dark:bg-slate-600 rounded-full shadow-inner transition-colors"
                            [class.bg-emerald-500]="isTranslationVisible()"
                            [class.dark:bg-emerald-400]="isTranslationVisible()"></div>
                        <div class="absolute w-4 h-4 bg-white rounded-full shadow top-1 left-1 transition-transform"
                            [class.translate-x-4]="isTranslationVisible()"></div>
                    </div>
                    <span class="ml-3 text-stone-700 dark:text-stone-200 font-medium">{{ isTranslationVisible() ?
                        'Translation' : 'Reading' }}</span>
                </label>
            </div>

            <!-- Ayah Navigation Dropdown -->
            <div class="relative">
                <select id="ayahSelect" [(ngModel)]="selectedAyahNumber" (ngModelChange)="onAyahSelect($event)"
                    class="w-32 px-3 py-1 text-sm border border-stone-300 dark:border-slate-600 rounded-md bg-white dark:bg-slate-700 text-stone-800 dark:text-stone-200 focus:border-emerald-500 focus:outline-none appearance-none">
                    <option value="">Go to Ayah</option>
                    @for (ayah of ayahs(); track ayah.surah_no + '-' + ayah.ayah_no) {
                    <option [value]="ayah.surah_no + ':' + ayah.ayah_no">
                        {{ ayah.ayah_no }}
                    </option>
                    }
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
                    <svg class="w-3 h-3 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="flex justify-center items-center px-2 py-4 font-indopak text-2xl md:text-4xl">
    بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ
</div>
@if (isLoading()) {
<app-ayah-skeleton [isTranslationVisible]="isTranslationVisible()"></app-ayah-skeleton>
} @else {
@if (!isTranslationVisible()) {
<!-- Reader Mode: Arabic Only -->
<div #ayahContainer class="pb-6 px-4">
    <div
        class="w-full bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-stone-200 dark:border-slate-600 p-8">
        <div dir="rtl" [style.fontSize.px]="quranService.ayahFontSize()"
            class="text-right font-indopak leading-[60px] md:leading-[70px] text-stone-800 dark:text-stone-200">
            @for (ayah of ayahs(); track $index) {
            <span class="cursor-pointer" [id]="'ayah-' + ayah.surah_no + '-' + ayah.ayah_no"
                (click)="navigateToTranslation(ayah)">
                {{ayah.arabic_text}}
            </span>
            <span
                class="inline-flex items-center justify-center w-8 h-8 mx-2 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 rounded-full border border-emerald-200 dark:border-emerald-800 text-sm font-bold hover:bg-emerald-200 dark:hover:bg-emerald-800/50 transition-colors">
                {{ayah.ayah_no}}
            </span>
            }
        </div>
    </div>
</div>
} @else {
<!-- Card Mode: Full Layout -->
<div #ayahContainer class="flex flex-col space-y-6 justify-center items-center pb-6 px-4">
    @for (ayah of ayahs(); track $index) {
    <app-ayah-card [id]="'ayah-' + ayah.surah_no + '-' + ayah.ayah_no" class="w-full" [ayah]="ayah"
        [surahNumber]="surahNumber()" [surahName]="surahName()" [surahName_ar]="surahName_ar()"
        [isTranslationVisible]="isTranslationVisible()" [bookmarkContext]="'surah'"
        (onReadClick)="navigateToReading(ayah)">
    </app-ayah-card>
    }
</div>
}
}
