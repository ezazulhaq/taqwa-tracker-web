<div #chatContainer class="h-full overflow-y-auto p-4">
    @if (messages().length === 0) {
    <div class="flex items-center justify-center h-full">
        <div class="text-center text-stone-500 dark:text-slate-400">
            <div
                class="p-4 bg-emerald-100 dark:bg-emerald-900/30 rounded-full w-16 h-16 mx-auto mb-4 flex items-center justify-center">
                <svg class="size-8 text-emerald-600 dark:text-emerald-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z"
                        clip-rule="evenodd" />
                </svg>
            </div>
            <h3 class="font-semibold text-lg mb-2">Islamic Guidance Assistant</h3>
            <p class="text-sm">Ask me questions about Islam and its teachings</p>
        </div>
    </div>
    } @else {
    <div class="flex flex-col space-y-4">
        @for (message of messages(); track $index) {
        @if (message.content) {
        <div class="flex" [class]="message.role === 'assistant' ? 'justify-start' : 'justify-end'">
            <div class="max-w-[80%] rounded-2xl px-4 py-3"
                [class]="message.role === 'assistant' ? 'bg-gradient-to-br from-emerald-50 to-teal-50 dark:from-slate-800 dark:to-slate-700 shadow-md border border-emerald-100/50 dark:border-slate-600/50' : 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg'">
                @if (message.role === 'assistant') {
                <div class="flex flex-row items-start space-x-2">
                    <div class="p-1 bg-emerald-100 dark:bg-emerald-900/30 rounded-full mt-1">
                        <svg class="size-3 text-emerald-600 dark:text-emerald-400" fill="currentColor"
                            viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="flex-1 text-start text-stone-700 dark:text-stone-300" [innerHTML]="message.content">
                    </div>
                </div>
                } @else {
                <div class="text-white text-start">{{message.content}}</div>
                }
            </div>
        </div>
        }
        }
    </div>
    }
</div>
