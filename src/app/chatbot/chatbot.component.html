<app-title [title]="'Islamic Guidance'" [subTitle]="'AI-powered Spiritual Assistant'"
    [routerLink]="'/home'"></app-title>

<div class="relative w-full mx-auto px-4 sm:px-6">
    <div class="flex flex-col h-[calc(100vh-8rem)]">
        <div class="flex flex-col h-full bg-white dark:bg-slate-800 overflow-hidden">
            <!-- Header -->
            <div class="absolute -top-16 left-4 flex justify-start items-center space-x-2">
                @if (isAuthenticated()) {
                <div class="relative conversation-menu">
                    <button (click)="toggleConversationMenu()"
                        class="p-2 rounded-full bg-emerald-600 hover:bg-emerald-700 dark:bg-emerald-500 dark:hover:bg-emerald-600 text-white shadow-md hover:shadow-lg transition-all"
                        title="Conversation history">
                        <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
                            fill="currentColor">
                            <path
                                d="M40 48C26.7 48 16 58.7 16 72l0 48c0 13.3 10.7 24 24 24l48 0c13.3 0 24-10.7 24-24l0-48c0-13.3-10.7-24-24-24L40 48zM192 64c-17.7 0-32 14.3-32 32s14.3 32 32 32l288 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L192 64zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32l288 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-288 0zm0 160c-17.7 0-32 14.3-32 32s14.3 32 32 32l288 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-288 0zM16 232l0 48c0 13.3 10.7 24 24 24l48 0c13.3 0 24-10.7 24-24l0-48c0-13.3-10.7-24-24-24l-48 0c-13.3 0-24 10.7-24 24zM40 368c-13.3 0-24 10.7-24 24l0 48c0 13.3 10.7 24 24 24l48 0c13.3 0 24-10.7 24-24l0-48c0-13.3-10.7-24-24-24l-48 0z" />
                        </svg>
                    </button>
                    @if (isConversationMenuVisible()) {
                    <app-conversation-history [conversations]="conversations()"
                        [deletingConversationId]="deletingConversationId()"
                        (loadConversation)="loadConversationMessages($event)"
                        (deleteConversation)="deleteConversation($event.id, $event.event)"
                        (startEditingTitle)="handleTitleEdit($event)" (saveTitle)="handleSaveTitle($event)"
                        (newChat)="clearChat()">
                    </app-conversation-history>
                    }
                </div>
                }
            </div>
            <!-- Chat Messages -->
            <div class="flex-1 min-h-0">
                <app-chat-messages [messages]="messages()"></app-chat-messages>
            </div>
            <!-- Input Container -->
            <div class="p-4 pb-20">
                <div class="text-xs text-center text-stone-500 dark:text-slate-400 mb-3">
                    AI can make mistakes. Please verify Islamic guidance with scholars.
                </div>
                <div class="flex items-center space-x-3 pb-2">
                    <input
                        class="flex-grow px-4 py-3 rounded-xl border border-stone-300 dark:border-slate-600 bg-stone-50 dark:bg-slate-700 text-stone-900 dark:text-stone-100 placeholder-stone-500 dark:placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all"
                        type="text" placeholder="Ask your Islamic question..." [(ngModel)]="userMessage"
                        (keydown.enter)="sendMessage()">
                    @if(isChatRequested()) {
                    <button class="p-3 rounded-xl bg-emerald-600 text-white" disabled>
                        <svg class="size-5 animate-spin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
                            fill="currentColor">
                            <path
                                d="M222.7 32.1c5 16.9-4.6 34.8-21.5 39.8C121.8 95.6 64 169.1 64 256c0 106 86 192 192 192s192-86 192-192c0-86.9-57.8-160.4-137.1-184.1c-16.9-5-26.6-22.9-21.5-39.8s22.9-26.6 39.8-21.5C434.9 42.1 512 140 512 256c0 141.4-114.6 256-256 256S0 397.4 0 256C0 140 77.1 42.1 182.9 10.6c16.9-5 34.8 4.6 39.8 21.5z" />
                        </svg>
                    </button>
                    } @else {
                    <button (click)="sendMessage()"
                        class="p-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white hover:from-emerald-700 hover:to-teal-700 transition-all shadow-lg hover:shadow-xl">
                        <svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
                            fill="currentColor">
                            <path
                                d="M16.1 260.2c-22.6 12.9-20.5 47.3 3.6 57.3L160 376l0 103.3c0 18.1 14.6 32.7 32.7 32.7c9.7 0 18.9-4.3 25.1-11.8l62-74.3 123.9 51.6c18.9 7.9 40.8-4.5 43.9-24.7l64-416c1.9-12.1-3.4-24.3-13.5-31.2s-23.3-7.5-34-1.4l-448 256zm52.1 25.5L409.7 90.6 190.1 336l1.2 1L68.2 285.7zM403.3 425.4L236.7 355.9 450.8 116.6 403.3 425.4z" />
                        </svg>
                    </button>
                    }
                </div>
            </div>
        </div>
    </div>
</div>
