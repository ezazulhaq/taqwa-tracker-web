@if(bookMarkDetails().length > 0 && isAuthenticated()){
<div
    class="bg-gradient-to-r from-emerald-50 to-teal-50 dark:from-slate-800 dark:to-slate-700 rounded-2xl p-6 mx-4 mb-6 shadow-lg border border-emerald-100 dark:border-slate-600">
    <div class="flex items-center mb-4">
        <div class="p-2 bg-emerald-100 dark:bg-emerald-900/30 rounded-full mr-3">
            <svg class="size-5 text-emerald-600 dark:text-emerald-400" fill="currentColor" viewBox="0 0 20 20">
                <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" />
            </svg>
        </div>
        <h3 class="text-lg font-semibold text-stone-800 dark:text-stone-200">Your Bookmarks</h3>
    </div>
    <div class="flex flex-wrap gap-2">
        @for(bookmark of bookMarkDetails(); track $index){
        <div
            class="flex items-center bg-white dark:bg-slate-700 rounded-lg border border-emerald-200 dark:border-slate-600 overflow-hidden shadow-sm">
            @if(bookmark.juz){
            <button [routerLink]="['../juz-ayah']"
                [queryParams]="{ juzNumber: bookmark.juz.juz_id, juzName: bookmark.juz.name, juzName_en: bookmark.juz.name_en, ayahNo: bookmark.bookmarked.ayah_id }"
                class="px-3 py-2 text-sm font-medium text-stone-700 dark:text-stone-200 hover:bg-emerald-50 dark:hover:bg-slate-600 transition-colors">
                {{ bookmark.juz.juz_id }} - {{ bookmark.juz.name_en }} : {{ bookmark.bookmarked.ayah_id }}
            </button>
            }@else{
            <button [routerLink]="['../surah-ayah']"
                [queryParams]="{ surahNumber: bookmark.surah.surah_id, surahName: bookmark.surah.name_transliteration, surahName_ar: bookmark.surah.name, ayahNo: bookmark.bookmarked.ayah_id }"
                class="px-3 py-2 text-sm font-medium text-stone-700 dark:text-stone-200 hover:bg-emerald-50 dark:hover:bg-slate-600 transition-colors">
                {{ bookmark.surah.surah_id }}-{{ bookmark.surah.name_transliteration }} : {{ bookmark.bookmarked.ayah_id
                }}
            </button>
            }
            <button (click)="removeBookmark(bookmark.bookmarked)"
                class="px-2 py-2 text-stone-500 dark:text-stone-400 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                <svg class="size-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                        clip-rule="evenodd" />
                </svg>
            </button>
        </div>
        }
    </div>
</div>
}
