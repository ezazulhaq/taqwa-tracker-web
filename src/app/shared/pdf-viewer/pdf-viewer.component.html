<div class="relative flex flex-col items-center justify-center max-w-2xl mx-auto w-full px-2">
    @if(isLoaded()){
    <div class="sticky top-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md border border-stone-200 dark:border-slate-700 py-2.5 px-4 flex flex-row justify-between items-center z-10 w-full rounded-xl mb-4 shadow-sm">
        <div class="flex flex-row items-center space-x-1">
            <!-- Zoom Out Button -->
            <button type="button" (click)="zoomOut()"
                class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 active:bg-slate-200 disabled:opacity-40 transition-colors"
                [disabled]="zoom() <= 0.5" title="Zoom Out">
                <svg class="size-5" fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    <path d="M7 9h5v1H7z" />
                </svg>
            </button>

            <!-- Zoom In Button -->
            <button type="button" (click)="zoomIn()"
                class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 active:bg-slate-200 disabled:opacity-40 transition-colors"
                [disabled]="zoom() >= 3" title="Zoom In">
                <svg class="size-5" fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path
                        d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    <path d="M7 9h5v1H7z" />
                    <path d="M9 7h1v5H9z" />
                </svg>
            </button>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Previous Page Button -->
            <button type="button" (click)="prevPage()"
                class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 active:bg-slate-200 disabled:opacity-40 transition-colors"
                [disabled]="page() <= 1" title="Previous Page">
                <svg class="size-5" fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
                    <path
                        d="M9.4 278.6c-12.5-12.5-12.5-32.8 0-45.3l128-128c9.2-9.2 22.9-11.9 34.9-6.9s19.8 16.6 19.8 29.6l0 256c0 12.9-7.8 24.6-19.8 29.6s-25.7 2.2-34.9-6.9l-128-128z" />
                </svg>
            </button>

            <div class="font-semibold text-sm px-2 text-slate-800 dark:text-slate-200 flex items-center gap-1">
                <input
                    class="w-14 text-center py-1 border border-stone-300 dark:border-slate-600 bg-stone-50 dark:bg-slate-700 text-stone-900 dark:text-white rounded-md text-sm"
                    type="text" placeholder="Page" [ngModel]="page()" (ngModelChange)="page.set($event)"
                    pattern="-?[0-9]*(\.[0-9]+)?">
                <span class="text-stone-500 dark:text-slate-400">/ {{totalPages()}}</span>
            </div>

            <!-- Next Page Button -->
            <button type="button" (click)="nextPage()"
                class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 active:bg-slate-200 disabled:opacity-40 transition-colors"
                [disabled]="page() >= totalPages()" title="Next Page">
                <svg class="size-5" fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
                    <path
                        d="M246.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-128-128c-9.2-9.2-22.9-11.9-34.9-6.9s-19.8 16.6-19.8 29.6l0 256c0 12.9 7.8 24.6 19.8 29.6s25.7 2.2 34.9-6.9l128-128z" />
                </svg>
            </button>
        </div>
    </div>
    }

    <pdf-viewer [src]="pdfSrc()" [original-size]="false" [autoresize]="true" [zoom]="zoom()" class="pdf-viewer"
        [page]="page()" (pageChange)="page.set($event)" (after-load-complete)="afterLoadComplete($event)"
        (page-rendered)="pageRendered($event)" (error)="onError($event)" (on-progress)="onProgress($event)">
    </pdf-viewer>

    @if (!isLoaded() && progressData) {
    <div class="absolute top-0 flex flex-col justify-center items-center h-full z-[8]">
        <svg aria-hidden="true" class="size-10 text-gray-200 animate-spin fill-slate-600" viewBox="0 0 100 101"
            fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                fill="currentColor" />
            <path
                d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                fill="currentFill" />
        </svg>
        <span class="sr-only">Loading...</span>
        <span>{{ +(progressData.loaded / progressData.total * 100) | number:'1.0-0' }}%</span>
    </div>
    }

</div>
