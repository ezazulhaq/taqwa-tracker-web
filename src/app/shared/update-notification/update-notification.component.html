<div @slideDown class="update-notification">
    <div class="update-content">
        <!-- Icon -->
        <div class="update-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
            </svg>
        </div>

        <!-- Message -->
        <div class="update-message">
            <h3 class="update-title">Update Available</h3>
            <p class="update-text">A new version of The Taqwa Tracker is ready to install.</p>
        </div>

        <!-- Actions -->
        <div class="update-actions">
            <button (click)="onUpdateClick()" class="btn-update">
                Update Now
            </button>
            <button (click)="onDismissClick()" class="btn-dismiss">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="close-icon">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
        </div>
    </div>
</div>
