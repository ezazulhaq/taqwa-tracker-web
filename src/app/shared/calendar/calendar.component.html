<div
  class="w-72 bg-white dark:bg-slate-800 backdrop-blur-xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:shadow-[0_8px_30px_rgba(0,0,0,0.4)] rounded-2xl border border-white/40 dark:border-slate-600/50 overflow-hidden">
  <div
    class="flex justify-between items-center bg-stone-100/40 dark:bg-slate-700/40 border-b border-stone-200/50 dark:border-slate-600/50 px-5 py-3">
    <button type="button" (click)="prevMonth()"
      class="p-1.5 rounded-lg hover:bg-white/60 dark:hover:bg-slate-600/70 hover:shadow-sm transition-all text-stone-600 dark:text-stone-300 group">
      <svg class="size-4 group-hover:-translate-x-0.5 transition-transform" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd"
          d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
          clip-rule="evenodd" />
      </svg>
    </button>
    <span class="font-bold text-stone-900 dark:text-stone-100">{{ currentMonth }} {{ currentYear }}</span>
    <button type="button" (click)="nextMonth()"
      class="p-1.5 rounded-lg hover:bg-white/60 dark:hover:bg-slate-600/70 hover:shadow-sm transition-all text-stone-600 dark:text-stone-300 group">
      <svg class="size-4 group-hover:translate-x-0.5 transition-transform" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd"
          d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
          clip-rule="evenodd" />
      </svg>
    </button>
  </div>
  <div class="grid grid-cols-7 gap-1 p-3">
    @for (day of daysOfWeek; track $index) {
    <div class="text-center text-xs font-bold text-stone-500 dark:text-slate-400 pb-2 uppercase tracking-wider">
      {{ day }}
    </div>
    }

    @for (day of days; track $index) {
    @if(day===0){
    <div class="p-1"></div>
    }
    @else {
    <div (click)="selectDate(day)"
      class="text-center py-2 px-1 text-sm font-medium cursor-pointer rounded-xl transition-all duration-200 hover:scale-105 active:scale-95"
      [ngClass]="{
        'bg-emerald-500 text-white shadow-md shadow-emerald-500/30': isSelectedDate(day),
        'text-stone-900 dark:text-stone-100 hover:bg-emerald-100/60 dark:hover:bg-emerald-900/40 hover:text-emerald-700 dark:hover:text-emerald-300': !isSelectedDate(day) && isCurrentMonth(day),
        'text-stone-400 dark:text-slate-500': !isCurrentMonth(day),
        'border-2 border-emerald-500/50 dark:border-emerald-400/50': isToday(day) && !isSelectedDate(day)
      }">
      {{ day }}
    </div>
    }
    }
  </div>
</div>
