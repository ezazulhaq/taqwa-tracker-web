<div class="flex flex-col space-y-4 w-full animate-pulse">

  <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-stone-200 dark:border-slate-600 p-6">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <div class="flex-shrink-0">
          <div class="w-12 h-12 bg-stone-200 dark:bg-slate-700 rounded-full"></div>
        </div>
        <div class="flex-grow space-y-2">
          <div class="h-4 bg-stone-200 dark:bg-slate-700 rounded w-24"></div>
          <div class="h-3 bg-stone-200 dark:bg-slate-700 rounded w-32"></div>
        </div>
      </div>
      <div class="text-right space-y-2">
        <div class="h-6 bg-stone-200 dark:bg-slate-700 rounded w-16 ml-auto"></div>
        <div class="h-3 bg-stone-200 dark:bg-slate-700 rounded w-12 ml-auto"></div>
      </div>
    </div>
