<div class="animate-pulse px-4 pb-6 section-fade-in">
    @if (!isTranslationVisible()) {
    <!-- Reader Mode Skeleton -->
    <div
        class="w-full bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-stone-200 dark:border-slate-600 p-8">
        <div class="space-y-4">
            <div class="h-8 bg-stone-200 dark:bg-slate-700 rounded-lg w-full"></div>
            <div class="h-8 bg-stone-200 dark:bg-slate-700 rounded-lg w-5/6 ml-auto"></div>
            <div class="h-8 bg-stone-200 dark:bg-slate-700 rounded-lg w-full"></div>
            <div class="h-8 bg-stone-200 dark:bg-slate-700 rounded-lg w-4/5 ml-auto"></div>
        </div>
    </div>
    } @else {
    <!-- Card Mode Skeleton -->
    <div class="flex flex-col space-y-6 justify-center items-center">
        @for (i of [1,2,3]; track i) {
        <div
            class="relative w-full bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-stone-200 dark:border-slate-600 p-8">
            <!-- Ayah Number Skeleton -->
            <div class="mb-6">
                <div class="w-10 h-10 bg-stone-200 dark:bg-slate-700 rounded-full"></div>
            </div>
            <!-- Arabic Text Skeleton -->
            <div class="space-y-3 mb-6">
                <div class="h-10 bg-stone-200 dark:bg-slate-700 rounded-lg w-full"></div>
                <div class="h-10 bg-stone-200 dark:bg-slate-700 rounded-lg w-3/4 ml-auto"></div>
            </div>
            <!-- Translation Skeleton -->
            <div class="border-t border-stone-200 dark:border-slate-600 pt-6">
                <div class="h-4 bg-stone-200 dark:bg-slate-700 rounded w-full mb-2"></div>
                <div class="h-4 bg-stone-200 dark:bg-slate-700 rounded w-5/6"></div>
            </div>
        </div>
        }
    </div>
    }
</div>
