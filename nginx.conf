server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Include MIME types and ensure webmanifest is recognized
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Angular PWA - Service Worker & Manifest files (never cache)
    location ~* (?:ngsw-worker\.js|ngsw\.json|manifest\.webmanifest|manifest-dark\.webmanifest|safety-worker\.js|worker-basic\.min\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static assets with cache-busting hashes in filename
    location ~* \.(?:css|js|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Media, images, and fonts
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA routing - Fallback all non-file routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicitly disable caching for index.html so updates are immediate
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
